{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header">
            <h3>Update Profile</h3>
        </div>

        <div class="card-body">

            <!-- Profile update form -->
            <form method="POST">

                <div class="mb-3">
                    <label>Username</label>
                    <input type="text"
                           name="username"
                           class="form-control"
                           value="{{ user.username }}"
                           required>
                </div>

                <div class="mb-3">
                    <label>Email</label>
                    <input type="email"
                           name="email"
                           class="form-control"
                           value="{{ user.email }}"
                           required>
                </div>

                <div class="mb-3">
                    <label>New Password</label>
                    <input type="password"
                           name="password"
                           class="form-control"
                           placeholder="Leave blank to keep current password">
                </div>

                <button class="btn btn-success">
                    Update Profile
                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
