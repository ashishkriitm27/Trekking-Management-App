<!-- Registration HTML Code -->

{% extends 'base.html' %}

{% set sidebar = False %}

{% block title %}Register{% endblock %}

{% block content %}

<div class="row justify-content-center mt-5">
    <div class="col-md-5">

        <div class="card p-4 shadow">

            <h3 class="text-center mb-4">Register</h3>
            <!-- Registration Form -->
            <form method="POST" action="/register">

                <input class="form-control mb-3" name="username" placeholder="Full Name" required>

                <input class="form-control mb-3" name="email" placeholder="Email" type="email" required>

                <input class="form-control mb-3" name="password" placeholder="Password" type="password" required>

                <input class="form-control mb-3" name="confirm_password" placeholder="Confirm Password" type="password"
                    required>

                <select class="form-select mb-3" name="type">
                    <option value="user">User</option>
                    <option value="staff">Staff</option>
                </select>

                <button class="btn btn-primary w-100" type="submit">
                    Register
                </button>
                <p class="mt-3 text-center">
                If already have account?
                <a href="{{ url_for('login') }}">Login</a>
            </p>

            </form>

        </div>

    </div>
</div>

{% endblock %}
