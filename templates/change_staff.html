{% extends 'base.html' %}
{% set sidebar = True %}

{% block content %}

<!-- Staff assignment page -->
<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header">
            <h4>Change Staff Assignment</h4>
        </div>

        <div class="card-body">

            <!-- Selected trek -->
            <h5 class="mb-3">
                Trek :
                <span class="text-primary">
                    {{ trek.name }}
                </span>
            </h5>

            <!-- Current staff details -->
            {% if trek.staff %}
            <div class="alert alert-success">
                Current Staff :
                <strong>{{ trek.staff.username }}</strong>
            </div>
            {% endif %}

            <!-- Assignment form -->
            <form method="POST">

                <div class="mb-3">

                    <label class="form-label">
                        Select New Staff
                    </label>

                    <select class="form-select" name="staff_id" required>
                        {% for staff in staffs %}
                        <option value="{{ staff.id }}"
                                {% if trek.staff_id == staff.id %}selected{% endif %}>
                            {{ staff.username }}
                        </option>
                        {% endfor %}
                    </select>

                </div>

                <button class="btn btn-success">
                    Update Assignment
                </button>

                <a href="/admin/treks" class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
