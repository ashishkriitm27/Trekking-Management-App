{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header">
            <h3>Edit Trek</h3>
        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">
                    <label class="form-label">Trek Name</label>
                    <input
                        type="text"
                        name="name"
                        class="form-control"
                        value="{{ trek.name }}"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Location</label>
                    <input
                        type="text"
                        name="location"
                        class="form-control"
                        value="{{ trek.location }}"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Difficulty</label>

                    <select name="difficulty" class="form-select">

                        <option value="Easy"
                            {% if trek.difficulty == 'Easy' %}selected{% endif %}>
                            Easy
                        </option>

                        <option value="Moderate"
                            {% if trek.difficulty == 'Moderate' %}selected{% endif %}>
                            Moderate
                        </option>

                        <option value="Hard"
                            {% if trek.difficulty == 'Hard' %}selected{% endif %}>
                            Hard
                        </option>

                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Status</label>

                    <select name="status" class="form-select">

                        <option value="Open"
                            {% if trek.status == 'Open' %}selected{% endif %}>
                            Open
                        </option>

                        <option value="Started"
                            {% if trek.status == 'Started' %}selected{% endif %}>
                            Started
                        </option>

                        <option value="Completed"
                            {% if trek.status == 'Completed' %}selected{% endif %}>
                            Completed
                        </option>

                        <option value="Closed"
                            {% if trek.status == 'Closed' %}selected{% endif %}>
                            Closed
                        </option>

                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Duration (Days)</label>
                    <input
                        type="number"
                        name="duration"
                        class="form-control"
                        value="{{ trek.duration }}"
                        min="1"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Total Slots</label>
                    <input
                        type="number"
                        name="total_slot"
                        class="form-control"
                        value="{{ trek.total_slot }}"
                        min="1"
                        required>
                </div>

                <div class="mb-4">
                    <label class="form-label">Assigned Staff</label>

                    <select name="staff_id" class="form-select">

                        <option value="">
                            -- No Staff Assigned --
                        </option>

                        {% for staff in staffs %}
                        <option
                            value="{{ staff.id }}"
                            {% if trek.staff_id == staff.id %}selected{% endif %}>

                            {{ staff.username }}

                        </option>
                        {% endfor %}

                    </select>

                </div>

                <button type="submit" class="btn btn-success">
                    Update Trek
                </button>

                <a href="/admin/treks" class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
